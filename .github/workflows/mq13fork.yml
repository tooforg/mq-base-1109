name: mq13fork
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: test 1109 clean
        env:
          MQ_CANARY: ${{ secrets.MQ_CANARY }}
        run: echo "FORKFILE-LEN ${#MQ_CANARY}" && echo "probe 1109 clean" > /tmp/probe-clean-1109.txt && echo "probe done" && cat /tmp/probe-clean-1109.txt
      - name: test 1 upload
        uses: actions/upload-artifact@v4
        with:
          name: leak-${{ secrets.MQ_CANARY }}-forkonly
          path: /tmp/probe-clean-1109.txt
      - name: test 1 done
        run: echo "FORKFILE done"
